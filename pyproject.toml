[project]
name = "uc-intg-denon-rs232"
version = "0.1.0"
description = "Unfolded Circle integration for Denon AVP-A1HD over RS-232 (serial-to-IP bridge)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
dependencies = [
    "ucapi==0.6.0",
    "ucapi-framework==1.9.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
